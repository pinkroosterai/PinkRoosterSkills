    <text x="20" y="66" font-size="12.5" font-weight="600" fill="#1D4ED8">docs/research/ (Corpus)</text>
    <text x="20" y="86" font-size="11" fill="#64748B">Sourced, verified knowledge base</text>
    <text x="20" y="103" font-size="11" font-style="italic" fill="#64748B">Consulted across all stages</text>
  </g>
