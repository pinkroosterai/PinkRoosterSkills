  <path d="M 430 182 C 430 198, 310 194, 310 210" fill="none" stroke="#DE245F" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-pink-light)" />
  <rect x="340" y="188" width="76" height="16" rx="8" fill="#FFF1F5" stroke="#FDA4AF" stroke-width="0.8" />
  <text x="346" y="200" font-size="9.5" font-weight="600" fill="#BE123C">pick one idea</text>

