    <circle cx="18" cy="22" r="5" fill="#F59E0B" />
    <text x="30" y="26" font-size="14" font-weight="600" fill="#0F172A">plan-work</text>
    <text x="30" y="47" font-size="11.5" fill="#64748B">docs/&lt;slug&gt;/[m&lt;N&gt;/]plan.md</text>
