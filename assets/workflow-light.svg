<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 690" width="100%" height="100%" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94A3B8" />
    </marker>
    <marker id="arrow-pink-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DE245F" />
    </marker>
    <marker id="arrow-emerald-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <!-- Subtle drop shadow -->
    <filter id="shadow-light" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.04)" />
    </filter>
  </defs>
  <rect width="1060" height="690" fill="#FFFFFF" />
  <!-- Zone 1: Governance Container -->
  <rect x="30" y="25" width="1000" height="64" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="50" y="45" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.08em">SYSTEM GOVERNANCE</text>

  <!-- Skill: maintain-agents-md -->
  <g transform="translate(195, 37)">
    <rect width="180" height="40" rx="8" fill="#FFFFFF" stroke="#F472B6" stroke-width="1.5" filter="url(#shadow-light)" />
    <circle cx="16" cy="20" r="5" fill="#811B53" />
    <text x="28" y="24" font-size="13" font-weight="600" fill="#0F172A">maintain-agents-md</text>
  </g>

  <!-- Arrow from maintain-agents-md to AGENTS.md -->
  <path d="M 375 57 L 415 57" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-light)" />

  <!-- Artifact: AGENTS.md / CLAUDE.md -->
  <g transform="translate(425, 37)">
    <rect width="210" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow-light)" />
    <text x="16" y="24" font-size="13" font-weight="600" fill="#0F172A">AGENTS.md / CLAUDE.md</text>
  </g>

  <text x="655" y="62" font-size="12" fill="#64748B">Lean rules (&lt; 200 lines) steering all agent sessions</text>
  <!-- Zone 2: Discovery & Spec Container -->
