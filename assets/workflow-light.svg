  <g transform="translate(50, 286)">
    <rect width="115" height="36" rx="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="14" y="22" font-size="12" font-weight="500" fill="#475569">Focused task</text>
  </g>
  <path d="M 165 304 L 195 304" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-light)" />

  <g transform="translate(205, 282)">
    <rect width="145" height="44" rx="8" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="1.5" filter="url(#shadow-light)" />
    <circle cx="16" cy="22" r="5" fill="#DE245F" />
    <text x="28" y="26" font-size="13" font-weight="600" fill="#0F172A">deepen-task</text>
  </g>
  <path d="M 350 304 L 380 304" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-light)" />

  <g transform="translate(390, 282)">
    <rect width="180" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow-light)" />
    <text x="14" y="21" font-size="12" font-weight="600" fill="#0F172A">Hardened Spec</text>
    <text x="14" y="36" font-size="10.5" fill="#64748B">Deeper, not bigger (no bloat)</text>
  </g>

