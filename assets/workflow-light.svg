  <g transform="translate(480, 488)">
    <rect width="255" height="66" rx="8" fill="#FFFFFF" stroke="#F472B6" stroke-width="1.5" filter="url(#shadow-light)" />
    <circle cx="18" cy="22" r="5" fill="#811B53" />
    <text x="30" y="26" font-size="13" font-weight="600" fill="#0F172A">execute-plan-with-subagents</text>
    <text x="30" y="48" font-size="11" fill="#64748B">Supervisor + phase workers</text>
    <rect x="172" y="38" width="75" height="18" rx="9" fill="#FDF2F8" stroke="#F472B6" stroke-width="1" />
    <text x="180" y="51" font-size="9.5" font-weight="600" fill="#811B53">Subagents</text>
  </g>

  <!-- Join into Verified Milestone -->
  <path d="M 300 554 C 300 580 440 580 440 604" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-light)" />
  <path d="M 610 554 C 610 580 520 580 520 604" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-light)" />

  <!-- Output: Verified Milestone -->
  <g transform="translate(385, 610)">
    <rect width="190" height="48" rx="24" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow-light)" />
    <circle cx="22" cy="24" r="6" fill="#10B981" />
    <text x="36" y="29" font-size="13" font-weight="700" fill="#047857">Verified Milestone</text>
  </g>

  <!-- Loop: Next milestone routed cleanly through wide corridor between 735 and 860 -->
  <path d="M 575 634 L 795 634 L 795 407 L 610 407" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-emerald-light)" />
  <rect x="752" y="510" width="86" height="20" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1" />
  <text x="758" y="524" font-size="10" font-weight="600" fill="#047857">next milestone</text>
  <!-- Diagnostics: five-whys (x = 860) -->
  <g transform="translate(860, 560)">
    <!-- Failure Input Badge -->
    <rect x="0" y="-36" width="160" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="14" y="-19" font-size="11" font-weight="600" fill="#475569">Failure / flake / bug</text>

    <!-- Arrow from input to five-whys -->
    <path d="M 80 -10 L 80 8" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-light)" />

    <!-- Card: five-whys -->
    <rect width="160" height="68" rx="8" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow-light)" />
    <circle cx="20" cy="24" r="5" fill="#F59E0B" />
    <text x="32" y="28" font-size="13.5" font-weight="600" fill="#0F172A">five-whys</text>
    <text x="16" y="47" font-size="11" fill="#64748B">Root-cause diagnosis</text>
    <text x="16" y="60" font-size="10.5" font-weight="600" fill="#B45309">Diagnose &amp; stop (no edits)</text>
  </g>
</svg>
