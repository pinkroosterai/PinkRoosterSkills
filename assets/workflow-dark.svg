<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" width="100%" height="100%" style="background-color: #0D1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6E7681" />
    </marker>
    <marker id="arrow-pink-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F43F5E" />
    </marker>
    <marker id="arrow-emerald-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <!-- Subtle drop shadow -->
    <filter id="shadow-dark" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)" />
    </filter>
  </defs>
  <rect width="1040" height="680" fill="#0D1117" />
  <!-- Zone 1: Governance Container -->
  <rect x="30" y="25" width="980" height="66" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="50" y="45" font-size="11" font-weight="700" fill="#8B949E" letter-spacing="0.08em">SYSTEM GOVERNANCE</text>

  <!-- Skill: maintain-agents-md -->
  <g transform="translate(195, 38)">
    <rect width="180" height="40" rx="8" fill="#21262D" stroke="#E879F9" stroke-width="1.5" filter="url(#shadow-dark)" />
    <circle cx="16" cy="20" r="5" fill="#A82B70" />
    <text x="28" y="24" font-size="13" font-weight="600" fill="#F0F6FC">maintain-agents-md</text>
  </g>

  <!-- Arrow from maintain-agents-md to AGENTS.md -->
  <path d="M 375 58 L 415 58" fill="none" stroke="#6E7681" stroke-width="2" marker-end="url(#arrow-dark)" />

  <!-- Artifact: AGENTS.md / CLAUDE.md -->
  <g transform="translate(425, 38)">
    <rect width="210" height="40" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1.5" filter="url(#shadow-dark)" />
    <text x="16" y="24" font-size="13" font-weight="600" fill="#F0F6FC">AGENTS.md / CLAUDE.md</text>
  </g>

  <text x="655" y="63" font-size="12" fill="#8B949E">Lean rules (&lt; 200 lines) steering all agent sessions</text>
  <!-- Zone 2: Discovery & Spec Container -->
  <rect x="30" y="110" width="980" height="225" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="50" y="132" font-size="11" font-weight="700" fill="#8B949E" letter-spacing="0.08em">DISCOVERY, SPECIFICATION &amp; RESEARCH</text>

  <!-- Row 1: Problem Space -> explore-ideas -> Backlog -->
  <!-- Input: Problem Space -->
  <g transform="translate(50, 150)">
    <rect width="115" height="36" rx="18" fill="#30363D" stroke="#484F58" stroke-width="1" />
    <text x="14" y="22" font-size="12" font-weight="500" fill="#C9D1D9">Problem space</text>
  </g>
  <path d="M 165 168 L 195 168" fill="none" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow-dark)" />

  <!-- Skill: explore-ideas -->
  <g transform="translate(205, 144)">
    <rect width="145" height="48" rx="8" fill="#21262D" stroke="#FB7185" stroke-width="1.5" filter="url(#shadow-dark)" />
    <circle cx="16" cy="24" r="5" fill="#F43F5E" />
    <text x="28" y="28" font-size="13" font-weight="600" fill="#F0F6FC">explore-ideas</text>
  </g>
  <path d="M 350 168 L 380 168" fill="none" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow-dark)" />

  <!-- Artifact: docs/ideas/<area>.md -->
  <g transform="translate(390, 144)">
    <rect width="180" height="48" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1.5" filter="url(#shadow-dark)" />
    <text x="14" y="24" font-size="12" font-weight="600" fill="#F0F6FC">docs/ideas/&lt;area&gt;.md</text>
    <text x="14" y="40" font-size="11" fill="#8B949E">Ranked idea backlog</text>
  </g>

  <!-- Curve: pick one idea from backlog down to shape-spec -->
  <path d="M 480 192 C 480 220 375 234 360 234" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-pink-dark)" />
  <text x="440" y="215" font-size="10.5" font-weight="500" fill="#F43F5E">pick one idea</text>

  <!-- Row 2: Concept -> shape-spec -> docs/<slug>/spec.md -->
  <!-- Input: Concept -->
  <g transform="translate(50, 216)">
    <rect width="115" height="36" rx="18" fill="#30363D" stroke="#484F58" stroke-width="1" />
    <text x="14" y="22" font-size="12" font-weight="500" fill="#C9D1D9">Broad concept</text>
  </g>
  <path d="M 165 234 L 195 234" fill="none" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow-dark)" />

  <!-- Skill: shape-spec -->
  <g transform="translate(205, 210)">
    <rect width="145" height="48" rx="8" fill="#21262D" stroke="#FB7185" stroke-width="1.5" filter="url(#shadow-dark)" />
    <circle cx="16" cy="24" r="5" fill="#F43F5E" />
    <text x="28" y="28" font-size="13" font-weight="600" fill="#F0F6FC">shape-spec</text>
  </g>
  <path d="M 350 234 L 380 234" fill="none" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow-dark)" />

  <!-- Artifact: spec.md + milestones -->
  <g transform="translate(390, 210)">
    <rect width="180" height="48" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1.5" filter="url(#shadow-dark)" />
    <text x="14" y="24" font-size="12" font-weight="600" fill="#F0F6FC">docs/&lt;slug&gt;/spec.md</text>
    <text x="14" y="40" font-size="11" fill="#8B949E">Confirmed spec + m1..mN/</text>
  </g>

  <!-- Row 3: Scoped Task -> deepen-task -> Hardened Spec -->
  <!-- Input: Task / Ticket -->
  <g transform="translate(50, 280)">
    <rect width="115" height="36" rx="18" fill="#30363D" stroke="#484F58" stroke-width="1" />
    <text x="14" y="22" font-size="12" font-weight="500" fill="#C9D1D9">Focused task</text>
  </g>
  <path d="M 165 298 L 195 298" fill="none" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow-dark)" />

  <!-- Skill: deepen-task -->
  <g transform="translate(205, 274)">
    <rect width="145" height="48" rx="8" fill="#21262D" stroke="#FB7185" stroke-width="1.5" filter="url(#shadow-dark)" />
    <circle cx="16" cy="24" r="5" fill="#F43F5E" />
    <text x="28" y="28" font-size="13" font-weight="600" fill="#F0F6FC">deepen-task</text>
  </g>
  <path d="M 350 298 L 380 298" fill="none" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow-dark)" />

  <!-- Artifact: Hardened Task Specification -->
  <g transform="translate(390, 274)">
    <rect width="180" height="48" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1.5" filter="url(#shadow-dark)" />
    <text x="14" y="24" font-size="12" font-weight="600" fill="#F0F6FC">Hardened Spec</text>
    <text x="14" y="40" font-size="11" fill="#8B949E">Deeper, not bigger (no bloat)</text>
  </g>

  <!-- Cross-Cutting Research Component -->
  <g transform="translate(680, 175)">
    <rect width="300" height="110" rx="8" fill="#21262D" stroke="#60A5FA" stroke-width="1.5" filter="url(#shadow-dark)" />
    <circle cx="20" cy="28" r="5" fill="#3B82F6" />
    <text x="34" y="32" font-size="14" font-weight="600" fill="#F0F6FC">research-topic</text>
    <path d="M 20 48 L 280 48" stroke="#30363D" stroke-width="1" />
    <text x="20" y="68" font-size="12" font-weight="600" fill="#93C5FD">docs/research/ (Corpus)</text>
    <text x="20" y="86" font-size="11" fill="#8B949E">Sourced, verified findings</text>
    <text x="20" y="100" font-size="10.5" font-style="italic" fill="#8B949E">Consulted across all stages</text>
  </g>
  <!-- Connector from spec.md down to plan-work -->
  <path d="M 480 258 L 480 365" fill="none" stroke="#6E7681" stroke-width="2" marker-end="url(#arrow-dark)" />
  <!-- Connector from deepen-task spec into plan-work -->
  <path d="M 570 298 C 610 298 610 395 595 395" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Planning Box: plan-work -->
  <g transform="translate(370, 370)">
    <rect width="225" height="60" rx="8" fill="#21262D" stroke="#FBBF24" stroke-width="1.5" filter="url(#shadow-dark)" />
    <circle cx="20" cy="24" r="5" fill="#F59E0B" />
    <text x="32" y="28" font-size="14" font-weight="600" fill="#F0F6FC">plan-work</text>
    <text x="32" y="46" font-size="11.5" fill="#8B949E">docs/&lt;slug&gt;/[m&lt;N&gt;/]plan.md</text>
    <rect x="120" y="14" width="92" height="18" rx="9" fill="#33220A" stroke="#FBBF24" stroke-width="1" />
    <text x="128" y="27" font-size="9.5" font-weight="600" fill="#FDE68A">≤ 8 phases / 40 tasks</text>
  </g>

  <!-- Execution Splitter lines -->
  <path d="M 430 430 C 430 455 310 455 310 478" fill="none" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow-dark)" />
  <path d="M 535 430 C 535 455 645 455 645 478" fill="none" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow-dark)" />

  <!-- Execution Mode 1: execute-plan (inline) -->
  <g transform="translate(195, 485)">
    <rect width="230" height="64" rx="8" fill="#21262D" stroke="#FB7185" stroke-width="1.5" filter="url(#shadow-dark)" />
    <circle cx="20" cy="24" r="5" fill="#F43F5E" />
    <text x="32" y="28" font-size="13.5" font-weight="600" fill="#F0F6FC">execute-plan</text>
    <text x="32" y="47" font-size="11" fill="#8B949E">Inline in main session</text>
    <rect x="145" y="14" width="72" height="18" rx="9" fill="#3A1424" stroke="#FB7185" stroke-width="1" />
    <text x="153" y="27" font-size="9.5" font-weight="600" fill="#FDA4AF">Main session</text>
  </g>

  <!-- Execution Mode 2: execute-plan-with-subagents -->
  <g transform="translate(530, 485)">
    <rect width="235" height="64" rx="8" fill="#21262D" stroke="#E879F9" stroke-width="1.5" filter="url(#shadow-dark)" />
    <circle cx="20" cy="24" r="5" fill="#A82B70" />
    <text x="32" y="28" font-size="13" font-weight="600" fill="#F0F6FC">execute-plan-with-subagents</text>
    <text x="32" y="47" font-size="11" fill="#8B949E">Supervisor + phase workers</text>
    <rect x="145" y="14" width="78" height="18" rx="9" fill="#2E1225" stroke="#E879F9" stroke-width="1" />
    <text x="153" y="27" font-size="9.5" font-weight="600" fill="#A82B70">Subagent tier</text>
  </g>

  <!-- Join into Verified Milestone -->
  <path d="M 310 549 C 310 575 440 575 440 595" fill="none" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow-dark)" />
  <path d="M 645 549 C 645 575 520 575 520 595" fill="none" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow-dark)" />

  <!-- Output: Verified Milestone -->
  <g transform="translate(385, 602)">
    <rect width="190" height="48" rx="24" fill="#0D2E24" stroke="#34D399" stroke-width="1.5" filter="url(#shadow-dark)" />
    <circle cx="22" cy="24" r="6" fill="#10B981" />
    <text x="36" y="29" font-size="13" font-weight="700" fill="#6EE7B7">Verified Milestone</text>
  </g>

  <!-- Loop: Next milestone back to plan-work -->
  <path d="M 575 626 C 800 626 800 400 605 400" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-emerald-dark)" />
  <text x="808" y="500" font-size="11" font-weight="600" fill="#6EE7B7">next milestone</text>
  <!-- Diagnostics: five-whys -->
  <g transform="translate(820, 560)">
    <!-- Failure Input Badge -->
    <rect x="0" y="-36" width="165" height="26" rx="13" fill="#30363D" stroke="#484F58" stroke-width="1" />
    <text x="14" y="-19" font-size="11" font-weight="600" fill="#C9D1D9">Failure / flake / bug</text>

    <!-- Arrow from input to five-whys -->
    <path d="M 82 -10 L 82 8" fill="none" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow-dark)" />

    <!-- Card: five-whys -->
    <rect width="165" height="68" rx="8" fill="#21262D" stroke="#FBBF24" stroke-width="1.5" filter="url(#shadow-dark)" />
    <circle cx="20" cy="24" r="5" fill="#F59E0B" />
    <text x="32" y="28" font-size="13.5" font-weight="600" fill="#F0F6FC">five-whys</text>
    <text x="16" y="47" font-size="11" fill="#8B949E">Root-cause diagnosis</text>
    <text x="16" y="60" font-size="10.5" font-weight="600" fill="#FDE68A">Diagnose &amp; stop (no edits)</text>
  </g>
</svg>
